name: Publish to PyPI

on:
  release:
    types: [published]

# Trusted Publishing (OIDC): GitHub authenticates to PyPI directly via a
# short-lived OIDC token. There is no long-lived API token to leak or rotate.
#
# One-time setup on the PyPI side (do this BEFORE the first release):
#   1. https://pypi.org/manage/project/corpdoc/settings/publishing/
#      (or https://pypi.org/manage/account/publishing/ for a pending project)
#   2. Add a Trusted Publisher with:
#        Owner:           RoCCoCo13
#        Repository:      corpdoc
#        Workflow:        release.yml
#        Environment:     pypi
#   3. Save. Subsequent releases will publish without a token.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/corpdoc

    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI
        # OIDC: no username/password/token env needed. The action mints a
        # short-lived token from PyPI using the workflow's OIDC identity.
        uses: pypa/gh-action-pypi-publish@release/v1
