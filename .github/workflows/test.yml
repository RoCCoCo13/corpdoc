name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  audit:
    name: Audit dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install project + pip-audit
        # Installing the project first resolves the full dependency graph
        # so pip-audit sees every transitive package, not just the direct
        # ones declared in pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit

      - name: Audit installed dependencies
        # `--ignore-vuln CVE-2026-3219` excludes a known issue in `pip`
        # itself, which is part of the runner image and outside CorpDoc's
        # control. Drop the ignore once setup-python ships a patched pip
        # baseline. Vulnerabilities in any CorpDoc runtime/dev dependency
        # will still fail this job.
        run: pip-audit --progress-spinner off --ignore-vuln CVE-2026-3219

  test:
    name: Test (${{ matrix.os }} · py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Render example (smoke test)
        run: |
          cd examples/corpdoc-sample
          python -m corpdoc.cli render demo.md --config corpdoc.yml --output demo.pdf

      - name: Verify PDF was created
        shell: bash
        run: test -f examples/corpdoc-sample/demo.pdf
