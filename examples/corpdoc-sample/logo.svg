<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 480 140"
     width="480"
     height="140"
     version="1.1">
  <!--
    CorpDoc Logo
    Mark: three overlapping rounded squares representing layered/stacked documents
          rotated slightly for dynamism, with a subtle accent stroke
    Wordmark: "corp" in forest green, "doc" in camel ocher, underline in camel
    Colors:
      - Primary (Forest): #1F4129
      - Accent  (Camel):  #C8A36A
      - Dark   (Slate):   #1E293B
  -->

  <!-- ═══════ MARK (left side) ═══════ -->
  <g transform="translate(20, 30)">
    <!-- Back document tile (camel, offset) -->
    <rect x="28" y="4" width="56" height="72" rx="8" ry="8"
          fill="#C8A36A" opacity="0.85"
          transform="rotate(-8 56 40)"/>

    <!-- Middle document tile (dark slate) -->
    <rect x="16" y="10" width="56" height="72" rx="8" ry="8"
          fill="#1E293B" opacity="0.9"
          transform="rotate(-3 44 46)"/>

    <!-- Front document tile (forest green) — the "featured" one -->
    <rect x="4" y="16" width="56" height="72" rx="8" ry="8"
          fill="#1F4129"/>

    <!-- Subtle highlight sliver for depth without using a gradient -->
    <rect x="4" y="16" width="56" height="6" rx="8" ry="8"
          fill="#2F6B42" opacity="0.9"/>

    <!-- Content lines on the front tile (white, representing text) -->
    <rect x="12" y="28" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.95"/>
    <rect x="12" y="38" width="30" height="3" rx="1.5" fill="#ffffff" opacity="0.75"/>
    <rect x="12" y="48" width="36" height="3" rx="1.5" fill="#ffffff" opacity="0.75"/>
    <rect x="12" y="58" width="22" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>

    <!-- Small accent dot (camel) - branding highlight -->
    <circle cx="48" cy="72" r="4" fill="#C8A36A"/>
  </g>

  <!-- ═══════ WORDMARK ═══════ -->
  <g transform="translate(130, 0)">
    <!-- "corp" in forest green primary -->
    <text x="0" y="90"
          font-family="Helvetica, Arial, sans-serif"
          font-size="62"
          font-weight="700"
          fill="#1F4129"
          letter-spacing="-2">corp</text>

    <!-- "doc" in camel accent -->
    <text x="148" y="90"
          font-family="Helvetica, Arial, sans-serif"
          font-size="62"
          font-weight="700"
          fill="#C8A36A"
          letter-spacing="-2">doc</text>

    <!-- Underline under "doc" (camel) -->
    <rect x="148" y="98" width="94" height="4" fill="#C8A36A"/>

    <!-- Tagline below -->
    <text x="2" y="120"
          font-family="Helvetica, Arial, sans-serif"
          font-size="11"
          font-weight="400"
          fill="#1E293B"
          letter-spacing="3">
      MARKDOWN · TO · CORPORATE · PDF
    </text>
  </g>
</svg>
